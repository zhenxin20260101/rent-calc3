<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>租金評定系統 鎮信/安東 v17.1</title>
    <style>
        :root { --primary: #2c3e50; --bg: #f8fafc; --accent: #3498db; --danger: #e74c3c; --success: #27ae60; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif; background-color: var(--bg); margin: 0; padding: 10px; color: #334155; }
        .container { max-width: 1200px; margin: auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .main-grid { display: grid; grid-template-columns: 1fr; }
        @media (min-width: 992px) { .main-grid { grid-template-columns: 1.1fr 0.9fr; } }
        .input-side { padding: 20px; border-bottom: 1px solid #edf2f7; }
        @media (min-width: 992px) { .input-side { border-bottom: none; border-right: 1px solid #edf2f7; } }
        .result-side { padding: 20px; background: #fafbfc; }
        .section-title { font-size: 1.1rem; color: var(--accent); font-weight: 800; margin: 15px 0 10px 0; border-left: 5px solid var(--accent); padding-left: 12px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 5px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; font-weight: bold; color: #64748b; }
        select, input { width: 100%; height: 42px; padding: 0 10px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; margin-bottom: 10px; }
        .drawer-btn { background: #f0f9ff; border: 2px dashed #3498db; color: #2980b9; width: 100%; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 15px; }
        #areaCalculator { display: none; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .calc-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        .calc-table th, .calc-table td { padding: 5px; border: 1px solid #e2e8f0; text-align: center; }
        .calc-table input { height: 28px; border-width: 1px; color: var(--danger); text-align: center; margin-bottom: 0; padding: 0; }
        .summary-box { background: #fff5f5; padding: 12px; border-radius: 10px; margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; border: 1px solid #feb2b2; }
        .summary-item { font-size: 0.8rem; font-weight: bold; }
        .summary-item span { display: block; font-size: 1.1rem; color: var(--danger); }
        .result-card { background: white; border: 2px solid #e0f2fe; border-radius: 16px; padding: 15px; }
        .res-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        .res-max-val { font-size: 2.2rem; font-weight: 900; color: var(--danger); text-align: right; display: block; }
        #statusBox { text-align: center; padding: 15px; border-radius: 12px; font-weight: 800; margin-top: 15px; }
        .status-init { background: #f1f5f9; color: #94a3b8; }
        .status-normal { background: #dcfce7; color: #166534; border: 2px solid #86efac; }
        .status-danger { background: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        .btn-apply { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; font-size: 1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h2>租金評定系統 鎮信/安東 v17.1</h2></div>
    <div class="main-grid">
        <div class="input-side">
            <button class="drawer-btn" onclick="toggleDrawer()">
                <span>📏 謄本面積換算 (含附屬建物與公設扣除)</span><span id="drawerArrow">▼</span>
            </button>
            <div id="areaCalculator">
                <table class="calc-table">
                    <thead><tr><th>項目</th><th>面積(m²)</th><th>分母</th><th>分子</th></tr></thead>
                    <tbody>
                        <tr><td>主建物</td><td><input type="number" id="mMain" value="63.66" oninput="runAreaCalc()"></td><td>1</td><td>1</td></tr>
                        <tr><td>陽台</td><td><input type="number" id="mBal" value="18.25" oninput="runAreaCalc()"></td><td>1</td><td>1</td></tr>
                        <tr><td>花台</td><td><input type="number" id="mFlower" value="2.2" oninput="runAreaCalc()"></td><td>1</td><td>1</td></tr>
                        <tr><td>雨遮</td><td><input type="number" id="mRain" value="0" oninput="runAreaCalc()"></td><td>1</td><td>1</td></tr>
                        <tr><td>平台</td><td><input type="number" id="mPlat" value="0" oninput="runAreaCalc()"></td><td>1</td><td>1</td></tr>
                        <tr><td>其他</td><td><input type="number" id="mOth" value="0" oninput="runAreaCalc()"></td><td>1</td><td>1</td></tr>
                        <tr style="background:#f1f5f9;"><td colspan="4">共有部分 (公設持分)</td></tr>
                        <tr><td>公設 1</td><td><input type="number" id="mS1" value="5699.05" oninput="runAreaCalc()"></td><td><input type="number" id="dS1" value="100000" oninput="runAreaCalc()"></td><td><input type="number" id="nS1" value="256" oninput="runAreaCalc()"></td></tr>
                        <tr><td>公設 2</td><td><input type="number" id="mS2" value="260.88" oninput="runAreaCalc()"></td><td><input type="number" id="dS2" value="10000" oninput="runAreaCalc()"></td><td><input type="number" id="nS2" value="425" oninput="runAreaCalc()"></td></tr>
                        <tr><td>公設 3</td><td><input type="number" id="mS3" value="0" oninput="runAreaCalc()"></td><td><input type="number" id="dS3" value="1" oninput="runAreaCalc()"></td><td><input type="number" id="nS3" value="0" oninput="runAreaCalc()"></td></tr>
                        <tr style="background:#ebf8ff;"><td style="color:blue; font-weight:bold;">車位扣除</td><td><input type="number" id="mCar" value="0" oninput="runAreaCalc()"></td><td><input type="number" id="dCar" value="1" oninput="runAreaCalc()"></td><td><input type="number" id="nCar" value="0" oninput="runAreaCalc()"></td></tr>
                    </tbody>
                </table>
                <div class="summary-box">
                    <div class="summary-item">專有面積(m²) <span id="outPri">0</span></div>
                    <div class="summary-item">公設面積(m²) <span id="outPub">0</span></div>
                    <div class="summary-item" style="border-top: 1px dashed #feb2b2; padding-top:5px;">總坪數(未扣除車位) <span id="outTotalPing">0</span></div>
                    <div class="summary-item" style="border-top: 1px dashed #feb2b2; padding-top:5px;">車位坪數 <span id="outCarPing">0</span></div>
                    
                    <div class="summary-item" style="grid-column: span 2; border-top: 1px solid #feb2b2; padding-top:5px;">
                        扣除車位後總坪數 <span id="outPing" style="font-size:1.5rem;">0</span>
                    </div>
                </div>
                <button class="btn-apply" style="margin-top:10px; background:#64748b;" onclick="applyArea()">帶入計算坪數</button>
            </div>

            <div class="section-title">評定核心資料</div>
            <div class="form-row">
                <div><label>縣市</label><select id="city" onchange="initDistricts()"><option value="桃園市">桃園市</option><option value="彰化縣">彰化縣</option><option value="南投縣">南投縣</option></select></div>
                <div><label>行政區</label><select id="district" onchange="calculate()"></select></div>
            </div>
            <div class="form-row">
                <div><label>計算坪數</label><input type="number" id="area" step="0.01" oninput="calculate()"></div>
                <div><label>案件類型</label><select id="caseType" onchange="calculate()"><option value="整層">整層</option><option value="套房">套房</option></select></div>
            </div>
            <div class="form-row">
                <div><label>完成日期(智慧)</label><input type="text" id="buildDate" placeholder="0830101" oninput="calcAgeByDate()"></div>
                <div><label>屋齡(年)</label><input type="number" id="age" value="0" oninput="calculate()"></div>
            </div>

            <div class="section-title">區位與裝修調整</div>
            <div class="form-row">
                <div><label>區位調整率</label>
                    <select id="adjLoc" onchange="calculate()">
                        <option value="0">中下區位 (0%)</option><option value="0.03">中上區位 (3%)</option><option value="0.05">優質區位 (5%)</option>
                    </select>
                </div>
                <div><label>裝修調整率</label>
                    <select id="adjDec" onchange="calculate()">
                        <option value="0">無裝修 (0%)</option><option value="0.03">簡易裝修 (3%)</option><option value="0.05">中等裝修 (5%)</option>
                    </select>
                </div>
            </div>
            <label>實收租金</label><input type="number" id="rent" placeholder="請輸入合約租金" oninput="calculate()">
        </div>

        <div class="result-side">
            <div class="result-card">
                <div class="res-row"><span>基準單價</span><span id="resRef">0</span></div>
                <div class="res-row"><span>加成後單價</span><span id="resAdj" style="font-weight:800;color:var(--accent);">0</span></div>
                <div style="text-align:right;margin-top:15px;"><label style="color:#64748b;">核定租金上限</label><span class="res-max-val" id="resMax">0</span></div>
            </div>
            <div id="statusBox" class="status-init">請輸入評定資料</div>
        </div>
    </div>
</div>

<script>
const masterData = {
    "桃園市": {
        "桃園區": { "整層": [780,770,755,735,720,700,680,650,620], "套房": [1120,1100,1080,1055,1025,1000,970,930,885] },
        "中壢區": { "整層": [770,760,745,725,705,685,670,640,610], "套房": [1080,1065,1045,1020,995,965,940,900,855] },
        "龜山區": { "整層": [855,840,825,805,785,760,740,710,675], "套房": [1225,1205,1185,1155,1125,1095,1065,1020,970] },
        "蘆竹區": { "整層": [745,735,720,705,685,665,645,620,590], "套房": [1180,1160,1140,1110,1080,1050,1020,980,935] },
        "八德區": { "整層": [735,720,710,690,675,655,635,610,580], "套房": [1045,1030,1010,985,960,935,905,870,830] },
        "平鎮區": { "整層": [720,710,700,680,660,645,625,600,570], "套房": [900,885,870,850,830,805,780,750,715] },
        "大園區": { "整層": [735,720,710,690,675,655,635,610,580], "套房": [1045,1030,1010,985,960,935,905,870,830] },
        "觀音區": { "整層": [700,685,675,660,640,625,605,580,555], "套房": [900,885,870,850,830,805,780,750,715] },
        "楊梅區": { "整層": [615,605,595,580,565,550,535,510,485], "套房": [830,815,805,780,760,740,720,690,660] },
        "龍潭區": { "整層": [580,570,560,545,530,515,500,480,460], "套房": [830,815,805,780,760,740,720,690,660] },
        "大溪區": { "整層": [565,555,550,535,520,505,490,470,450], "套房": [710,700,685,670,650,635,615,590,565] },
        "新屋區": { "整層": [580,570,560,545,530,515,500,480,460], "套房": [625,615,605,590,575,560,545,520,495] },
        "復興區": { "整層": [375,370,360,355,345,335,325,310,295], "套房": [385,380,375,365,355,345,335,320,305] }
    },
   "彰化縣": {
    "彰化市": { "整層":[600,590,580,565,550,535,520,500,475], "套房":[745,735,720,705,685,665,645,620,590] },
    "員林市": { "整層":[600,590,580,565,550,535,520,500,475], "套房":[675,665,650,635,620,600,585,560,535] },
    "和美鎮": { "整層":[555,545,535,520,510,495,480,460,440], "套房":[565,555,550,535,520,505,490,470,450] },
    "鹿港鎮": { "整層":[505,500,490,475,465,450,440,420,400], "套房":[565,555,550,535,520,505,490,470,450] },
    "秀水鄉": { "整層":[480,475,465,455,445,430,420,400,380], "套房":[565,555,550,535,520,505,490,470,450] },
    "社頭鄉": { "整層":[470,465,455,445,430,420,410,390,375], "套房":[480,475,465,455,445,430,420,400,380] }
},
"南投縣": {
    "草屯鎮": { "整層":[625,615,605,590,575,560,545,520,495], "套房":[660,650,640,625,605,590,575,550,525] },
    "南投市": { "整層":[600,590,580,565,550,535,520,500,475], "套房":[660,650,640,625,605,590,575,550,525] },
    "埔里鎮": { "整層":[580,570,560,545,530,515,500,480,460], "套房":[600,590,580,565,550,535,520,500,475] },
    "竹山鎮": { "整層":[435,425,420,410,400,390,375,360,345], "套房":[480,475,465,455,445,430,420,400,380] },
    "名間鄉": { "整層":[410,405,395,385,375,365,355,340,325], "套房":[420,415,410,400,390,375,365,350,335] }
}
};

const otherCh = ["溪湖鎮","田中鎮","北斗鎮","二林鎮","鹿港鎮","秀水鄉","大村鄉","線西鄉","花壇鄉","伸港鄉","埔心鄉","埔鹽鄉","埤頭鄉","永靖鄉","溪州鄉","田尾鄉","福興鄉","竹塘鄉","芳苑鄉","社頭鄉"];
const otherNt = ["草屯鎮","埔里鎮","竹山鎮","名間鄉","水里鄉","集集鎮","魚池鄉","鹿谷鄉","中寮鄉","國姓鄉","信義鄉","仁愛鄉"];

function toggleDrawer() {
    const d = document.getElementById('areaCalculator');
    d.style.display = (d.style.display==='block')?'none':'block';
    document.getElementById('drawerArrow').innerText = (d.style.display==='block')?'▲':'▼';
}

function runAreaCalc() {
    const pri = ["mMain", "mBal", "mFlower", "mRain", "mPlat", "mOth"].reduce((acc, id) => acc + parseFloat(document.getElementById(id).value || 0), 0);
    const getSub = (m, d, n) => parseFloat(document.getElementById(m).value||0) * (parseFloat(document.getElementById(n).value||0)/parseFloat(document.getElementById(d).value||1));
    const pub = getSub('mS1','dS1','nS1') + getSub('mS2','dS2','nS2') + getSub('mS3','dS3','nS3');
    const car = getSub('mCar','dCar','nCar');
    
    // 計算各項坪數
    const totalPing = (pri + pub) * 0.3025; // 總坪數 (未扣車位)
    const carPing = car * 0.3025;          // 車位坪數
    const finalPing = (pri + pub - car) * 0.3025;
    
    document.getElementById('outPri').innerText = pri.toFixed(2);
    document.getElementById('outPub').innerText = pub.toFixed(2);
    
    // 將計算完的坪數渲染到新欄位
    document.getElementById('outTotalPing').innerText = totalPing.toFixed(2);
    document.getElementById('outCarPing').innerText = carPing.toFixed(2);
    
    document.getElementById('outPing').innerText = finalPing.toFixed(2);
}

function applyArea() {
    document.getElementById('area').value = document.getElementById('outPing').innerText;
    toggleDrawer(); calculate();
}

function calcAgeByDate() {
    const s = document.getElementById('buildDate').value;
    if (s.length >= 7) {
        const buildYear = parseInt(s.substring(0, 3));
        if (!isNaN(buildYear)) {
            const currentYear = new Date().getFullYear() - 1911;
            document.getElementById('age').value = Math.max(0, currentYear - buildYear);
            calculate();
        }
    }
}

function initDistricts() {
    const city = document.getElementById('city').value;
    const distSelect = document.getElementById('district');
    distSelect.innerHTML = "";
    
    // 使用 Set 解決重複行政區問題
    let distSet = new Set(Object.keys(masterData[city] || {}));
    if (city === "彰化縣") otherCh.forEach(d => distSet.add(d));
    if (city === "南投縣") otherNt.forEach(d => distSet.add(d));
    
    distSet.forEach(d => { 
        let opt = document.createElement('option'); 
        opt.value = d; 
        opt.innerText = d; 
        distSelect.appendChild(opt); 
    });
    calculate();
}

function calculate() {
    const city = document.getElementById('city').value;
    const dist = document.getElementById('district').value;
    const type = document.getElementById('caseType').value;
    const age = parseFloat(document.getElementById('age').value) || 0;
    const area = parseFloat(document.getElementById('area').value) || 0;
    const rent = parseFloat(document.getElementById('rent').value) || 0;
    const adjL = parseFloat(document.getElementById('adjLoc').value);
    const adjD = parseFloat(document.getElementById('adjDec').value);

    // 取得基準單價
    const priceList = (masterData[city] && masterData[city][dist]) 
        ? masterData[city][dist][type] 
        : (type === "整層" ? [400,390,385,375,365,355,345,330,315] : [385,380,375,365,355,345,335,320,305]);
    
    const basePrice = priceList[Math.min(8, Math.floor(age / 5))];
    const adjustedPrice = basePrice * (1 + adjL + adjD);
    
    document.getElementById('resRef').innerText = basePrice + " 元/坪";
    document.getElementById('resAdj').innerText = Math.round(adjustedPrice) + " 元/坪";
    
    // 取得縣市上限
    let cap = (city === "桃園市") ? (type === "整層" ? 35000 : 21000) : (type === "整層" ? 22000 : 13000);
    
    // 計算上限 (增加防呆防止 NaN)
    let maxVal = 0;
    if (!isNaN(adjustedPrice) && !isNaN(area) && area > 0) {
        maxVal = Math.min(adjustedPrice * area, cap);
    }
    
    document.getElementById('resMax').innerText = Math.round(maxVal).toLocaleString() + " 元";

    const box = document.getElementById('statusBox');
    if (rent === 0 || area === 0) { 
        box.innerText = "待輸入關鍵數據"; 
        box.className = "status-init"; 
    } else if (rent > maxVal) { 
        box.innerText = "❌ 評定不通過 (租金超額)"; 
        box.className = "status-danger"; 
    } else { 
        box.innerText = "✅ 評定符合標準"; 
        box.className = "status-normal"; 
    }
}

// 初始化
initDistricts(); 
runAreaCalc();
</script>
</body>
</html>
